services:
  # Frontend Static Site
  - type: static
    name: campushub-frontend
    env: static
    buildCommand: npm install && cd frontend && npm install && npm run build
    publishPath: ./frontend/dist
    routes:
      # Rewrite all requests to index.html for client-side routing fallback
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend Web Service
  - type: web
    name: campushub-backend
    env: node
    buildCommand: npm install && cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
